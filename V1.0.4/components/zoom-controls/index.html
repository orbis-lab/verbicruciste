<div class="zoom-controls-wrapper">
    <!-- Bouton de réinitialisation à gauche -->
    <button class="zoom-btn reset-zoom" id="zoomResetBtn" data-tooltip="Zoom initial">
        <span class="material-symbols-outlined">restart_alt</span>
    </button>

    <!-- Badge de zoom -->
    <div class="zoom-badge">
        <button class="zoom-btn" id="zoomInBtn" data-tooltip="Zoom avant">
            <span class="material-symbols-outlined">zoom_in</span>
        </button>
        <span class="zoom-level" id="zoomLevelDisplay">80%</span>
        <button class="zoom-btn" id="zoomOutBtn" data-tooltip="Zoom arrière">
            <span class="material-symbols-outlined">zoom_out</span>
        </button>
    </div>
</div>
