<div class="topbar">
    <!-- BLOC 1 : Fichiers, Projet & Paramètres -->
    <button id="newGridBtn" class="icon-btn" data-tooltip="Nouvelle grille">
        <span class="material-symbols-outlined">new_window</span>
    </button>

    <button id="openGridBtn" class="icon-btn" data-tooltip="Ouvrir">
        <span class="material-symbols-outlined">folder_open</span>
    </button>

    <button id="saveGridBtn" class="icon-btn" data-tooltip="Enregistrer">
        <span class="material-symbols-outlined">save</span>
    </button>

    <button id="saveAsGridBtn" class="icon-btn" data-tooltip="Enregistrer sous">
        <span class="material-symbols-outlined">save_as</span>
    </button>

    <button id="printGridBtn" class="icon-btn" data-tooltip="Imprimer">
        <span class="material-symbols-outlined">print</span>
    </button>

    <button id="settingsGridBtn" class="icon-btn" data-tooltip="Paramètres">
        <span class="material-symbols-outlined">settings</span>
    </button>

    <div class="topbar-separator"></div>

    <!-- BLOC 2 : Édition locale de la grille -->
    <button id="clearCellBtn" class="icon-btn danger-btn" data-tooltip="Effacer case">
        <span class="material-symbols-outlined">ink_eraser</span>
    </button>

    <button id="clearGridBtn" class="icon-btn danger-btn" data-tooltip="Vider la grille">
        <span class="material-symbols-outlined">delete_sweep</span>
    </button>

    <div class="topbar-separator"></div>

    <!-- BLOC 3 : Confort & Aide -->
    <button id="themeAppBtn" class="icon-btn" data-tooltip="Thème">
        <span class="material-symbols-outlined">palette</span>
    </button>

    <button id="helpAppBtn" class="icon-btn" data-tooltip="Aide">
        <span class="material-symbols-outlined">help</span>
    </button>

    <div class="topbar-separator"></div>

    <button id="userAppBtn" class="icon-btn" data-tooltip="Mon compte">
        <span class="material-symbols-outlined">account_circle</span>
    </button>

</div>
