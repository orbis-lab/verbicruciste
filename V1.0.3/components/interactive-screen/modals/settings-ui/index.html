<div class="form-group">
    <label>Nom de la grille</label>
    <input type="text" id="settingName" placeholder="Ex: Grille Facile N°1">
</div>
<div class="form-group">
    <label>Nombre de colonnes</label>
    <input type="number" id="settingCols" min="5" max="50">
</div>
<div class="form-group">
    <label>Nombre de lignes</label>
    <input type="number" id="settingRows" min="5" max="50">
</div>
<div style="margin-top: 16px; text-align: right;">
    <button id="applySettingsBtn" class="btn-primary">
        <span class="material-symbols-outlined float-r">arrow_forward</span>
        Valider
    </button>
</div>
