<div id="customConfirmModal" class="modal-overlay">
    <div class="modal-card"
        style="padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 320px; max-width: 400px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <h3 style="margin: 0; font-size: 1.25rem; font-weight: 600; color: #1a1a1a;">Confirmation</h3>
        <p id="customConfirmMessage" style="margin: 0; font-size: 0.95rem; color: #4a4a4a; line-height: 1.5;"></p>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
            <button type="button" id="customConfirmCancelBtn" class="btn-danger"
                style="padding: 10px 20px; font-weight: 500; cursor: pointer; transition: background-color 0.2s ease;"><span
                    class="material-symbols-outlined float-l">close</span>Annuler</button>
            <button type="button" id="customConfirmOkBtn" class="btn-primary"
                style="padding: 10px 20px; font-weight: 500; cursor: pointer; transition: background-color 0.2s ease;"><span
                    class="material-symbols-outlined float-r">arrow_forward</span>Confirmer</button>
        </div>
    </div>
</div>
